name: bcl2fastq-env
channels:
  - bih-cubi
  - bioconda
  - bioinfo
  - defaults
  - conda-forge
  - nodefaults
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=5.1
  - bcl2fastq2=2.20.0.422
  - libgcc=7.2.0
  - libgcc-ng=11.2.0
  - libgomp=11.2.0
  - libstdcxx-ng=11.2.0
  - zlib=1.2.13
prefix: ~/.conda/envs/bcl2fastq-env
